services:
  postgres:
    image: postgres:16-alpine
    container_name: proaffluence-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proaffluence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proaffluence_secret}
      POSTGRES_DB: ${POSTGRES_DB:-proaffluence_dev}
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-proaffluence} -d ${POSTGRES_DB:-proaffluence_dev}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: proaffluence-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
    name: proaffluence-pgdata
  redisdata:
    name: proaffluence-redisdata
