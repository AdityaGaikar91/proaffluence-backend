services:
  postgres:
    image: postgres:16-alpine
    container_name: proaffluence-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proaffluence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proaffluence_secret}
      POSTGRES_DB: ${POSTGRES_DB:-proaffluence_dev}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proaffluence} -d ${POSTGRES_DB:-proaffluence_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
    name: proaffluence-pgdata
